services:
  # --- NestJS Application ---
  app:
    build: .
    container_name: ezon-app
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    env_file:
      - .env
    volumes:
      - app_uploads:/app/uploads
    restart: unless-stopped

  # --- PostgreSQL ---
  postgres:
    image: postgres:17-alpine
    container_name: ezon-postgres
    environment:
      POSTGRES_DB: ezon
      POSTGRES_USER: ezon
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ezon_dev}
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ezon -d ezon']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --- S3-compatible storage (MinIO) ---
  minio:
    image: minio/minio:latest
    container_name: ezon-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Console
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # --- Nginx reverse proxy ---
  nginx:
    image: nginx:alpine
    container_name: ezon-nginx
    ports:
      - '8080:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - app
    restart: unless-stopped

  # --- Certbot (TLS certificate renewal) ---
  certbot:
    image: certbot/certbot:latest
    container_name: ezon-certbot
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: |
      sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h; done'
    restart: unless-stopped

volumes:
  pg_data:
  minio_data:
  app_uploads:
  certbot_webroot:
  certbot_certs:
